<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Guía de Stardew Valley</title>
  <meta name="description" content="Formulario de contacto para resolver dudas y compartir opiniones sobre Stardew Valley.">
  <meta name="keywords" content="Stardew Valley, contacto, formulario, consultas, opiniones">
  <meta name="author" content="Xinyi Ye">
</head>

<body>
  <!-- Cabecera -->
  <div>
    <h1>Contacto de Stardew Valley</h1>
    <p>Rellena en el formurario para realizar una consulta de Stardew Valley.</p>
  </div>

  <form action="#" method="get">
    <fieldset>
      <legend>Tus datos</legend>
    <div>
      <label for="nombre">Nombre: </label>
      <input type="text" id="nombre" name="nombre" required maxlength="40" placeholder="Escribe tu nombre" autofocus>
    </div>

    <div>
      <label for="correo">Correo electrónico: </lavel>
      <input type="email" id="correo" name="correo" required maxlength="50">
    </div>

    <div>
      <label for="telefono">Teléfono: </label>
      <input type="tel" id="telefono" name="telefono" required maxlength="20">
    </div>
    </fieldset>

    <br> <!--Separar arríba y abajo-->

    <fieldset>
      <legend>Tu consulta</legend>
      <div>
         <label for="estacion_favorita">¿Cuál es tu estación favorita?</label>
         <select id="estacion_favorita" name="estacion">
            <option value="" selected>--Selecciona una estación--</option>
            <option value="primavera">Primavera</option>
            <option value="verano">Verano</option>
            <option value="otono">Otoño</option>
            <option value="invierno">Invierno</option>
         </select>
      </div>

      <br>

      <div>
        <p>¿Qué actividades te gustan de Stardew Valley?</p>

        <label for="cultivar">Cultivar</label>
        <input type="checkbox" id="cultivar" name="actividades" value="cultivar">

        <label for="pescar">Pescar</label>
        <input type="checkbox" id="pescar" name="actividades" value="pescar">

        <label for="minar">Minar</label> 
         <input type="checkbox" id="minar" name="actividades" value="minar">    
      </div>

      <br>

      <div>
        <p>¿Qué opinas de Stardew Valley?</p>

        <label for="excelente">Excelente</label>
        <input type="radio" id="excelente" name="opinion" value="excelente" checked>

        <label for="bueno">Bueno</label>
        <input type="radio" id="bueno" name="opinion" value="bueno">

        <label for="regular">Regular</label>
        <input type="radio" id="regular" name="opinion" value="regular">
      </div>

      <br>
      <br>

      <div>
        <label for="mensaje">Mensaje: </label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40" minlength="10" placeholder="Escribe aquí tu consulta sobre Stardew Valley..."></textarea>
      </div>

    </fieldset>

    <div>
    <button type="submit">Enviar</button>
    <button type="reset">Borrar datos</button>
  </div>
    
  </form>
  
  <!--Pie de página-->
    <div>
        <p>&copy;2026 Xinyi Ye</p>
    </div>
</body>
</html>
